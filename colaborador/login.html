<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Colaborador | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--secondary) 0%, #003D5C 100%);
        }

        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo img {
            height: 60px;
            margin-bottom: 1rem;
        }

        .login-logo h1 {
            color: var(--secondary);
            font-size: 1.5rem;
            margin: 0;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(201, 149, 111, 0.3);
        }

        .login-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background: var(--primary-dark);
        }

        .demo-credentials {
            background: #E8F4F8;
            border-left: 4px solid #00A3CC;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 2rem;
            font-size: 0.85rem;
        }

        .demo-credentials h4 {
            margin: 0 0 0.5rem 0;
            color: #00A3CC;
        }

        .demo-credentials p {
            margin: 0.25rem 0;
            color: var(--text);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="../assets/images/logobpi-light.svg" alt="BPI Governança">
                <h1>BPI Governança</h1>
                <div class="login-subtitle">Acesso Colaborador</div>
            </div>

            <form class="login-form" onsubmit="loginColaborador(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="seu@bpigovernanca.com.br">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>
                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <div class="demo-credentials">
                <h4>📌 Credenciais de Teste</h4>
                <p><strong>PMO (Geral):</strong></p>
                <p style="margin-left: 1rem;">pmo@bpigovernanca.com.br<br>PMO123!</p>
                <p style="margin-top: 0.5rem;"><strong>Comercial (Propostas):</strong></p>
                <p style="margin-left: 1rem;">comercial@bpigovernanca.com.br<br>Comercial123!</p>
            </div>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        function loginColaborador(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            const user = AuthManager.login(email, senha, 'colaborador');
            if (user) {
                showNotification('Login realizado com sucesso!', 'success');
                setTimeout(() => {
                    window.location.href = './dashboard.html';
                }, 500);
            } else {
                showNotification('Email ou senha inválidos', 'error');
            }
        }
    </script>
</body>
</html>
