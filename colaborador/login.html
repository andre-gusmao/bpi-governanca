<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPI Governança - Login Colaborador</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    body {
      background: var(--gradient-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-lg);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: white;
      border-radius: var(--border-radius-xl);
      padding: var(--spacing-2xl);
      box-shadow: var(--shadow-premium);
      animation: slideUp 0.5s ease-out;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-2xl);
    }

    .login-logo {
      width: 60px;
      height: 60px;
      background: var(--gradient-gold);
      border-radius: var(--border-radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: var(--fw-bold);
      color: white;
      margin: 0 auto var(--spacing-lg);
    }

    .login-header h1 {
      font-size: var(--fs-2xl);
      margin-bottom: var(--spacing-sm);
    }

    .login-header p {
      color: #9CA3AF;
      font-size: var(--fs-sm);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group label {
      display: block;
      margin-bottom: var(--spacing-sm);
      font-weight: var(--fw-semibold);
      color: var(--color-dark-primary);
    }

    .form-group input {
      width: 100%;
      padding: var(--spacing-md);
      border: 1px solid #D1D5DB;
      border-radius: var(--border-radius-lg);
      font-size: var(--fs-base);
      transition: all var(--transition-fast);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--color-primary-gold);
      box-shadow: 0 0 0 3px rgba(201, 166, 107, 0.1);
      background: #FFFBF7;
    }

    .login-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xl);
      font-size: var(--fs-sm);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-password a {
      color: var(--color-primary-gold);
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: var(--spacing-md);
      background: var(--gradient-gold);
      color: white;
      border: none;
      border-radius: var(--border-radius-lg);
      font-size: var(--fs-base);
      font-weight: var(--fw-bold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-md);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .login-footer {
      text-align: center;
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-lg);
      border-top: 1px solid #E5E7EB;
      color: #9CA3AF;
      font-size: var(--fs-sm);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      color: var(--color-error);
      padding: var(--spacing-md);
      border-radius: var(--border-radius-lg);
      margin-bottom: var(--spacing-lg);
      display: none;
      font-size: var(--fs-sm);
    }

    .error-message.show {
      display: block;
      animation: slideUp 0.3s ease-out;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">⬤</div>
        <h1>BPI Governança</h1>
        <p>Portal de Colaboradores</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Corporativo</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="seu.email@bpi.com.br" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••" 
            required
          >
        </div>

        <div class="login-actions">
          <label class="remember-me">
            <input type="checkbox" name="remember">
            Lembrar-me
          </label>
          <div class="forgot-password">
            <a href="#">Esqueci a senha</a>
          </div>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
      </form>

      <div class="login-footer">
        © 2026 BPI Governança. Todos os direitos reservados.
      </div>
    </div>
  </div>

  <script src="../assets/js/portal-session.js"></script>
  <script>
    // Usuários de teste
    const testUsers = [
      {
        id: 'col-001',
        name: 'André Gusmão',
        email: 'andre@bpi.com.br',
        password: '123456',
        role: 'PMO_Comercial',
        avatar: 'AG'
      },
      {
        id: 'col-002',
        name: 'Maria Silva',
        email: 'maria@bpi.com.br',
        password: '123456',
        role: 'PMO',
        avatar: 'MS'
      },
      {
        id: 'col-003',
        name: 'João Santos',
        email: 'joao@bpi.com.br',
        password: '123456',
        role: 'Comercial',
        avatar: 'JS'
      }
    ];

    function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      // Buscar usuário
      const user = testUsers.find(u => u.email === email && u.password === password);

      if (user) {
        // Salvar sessão
        BPIPortalSession.setSession('colaborador', user);
        
        // Redirecionar
        window.location.href = obterRetornoSeguro() || './dashboard.html';
      } else {
        errorDiv.textContent = 'Email ou senha inválidos';
        errorDiv.classList.add('show');
        setTimeout(() => errorDiv.classList.remove('show'), 5000);
      }

      function obterRetornoSeguro() {
        const urlParams = new URLSearchParams(window.location.search);
        const retorno = urlParams.get('return');
        if (!retorno) return null;
        const retornosPermitidos = {
          '../colaborador/dashboard.html': './dashboard.html',
          '../colaborador/comercial.html': './comercial.html',
          '../colaborador/pmo-geral.html': './pmo-geral.html',
          '../colaborador/proposta-detalhes.html': './proposta-detalhes.html'
        };
        return retornosPermitidos[retorno] || null;
      }
    }

    // Auto-login para teste (remover em produção)
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('demo') === 'true') {
        document.getElementById('email').value = 'andre@bpi.com.br';
        document.getElementById('password').value = '123456';
      }
    });
  </script>
</body>
</html>
