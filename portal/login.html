<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Redirecionamento para o login do cliente">
    <title>Redirecionando | BPI Governança</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }
        .redirect-box {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .redirect-box a {
            color: #c9a66b;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <p>Redirecionando para o login do cliente...</p>
        <p><a id="loginLink" href="../cliente/login.html">Clique aqui se não for redirecionado</a></p>
    </div>
    <script>
        const destinoBase = '../cliente/login.html';
        const params = new URLSearchParams(window.location.search || '');
        const retornoCru = params.get('return');
        if (retornoCru) {
            let retorno = retornoCru;
            try {
                retorno = decodeURIComponent(retornoCru);
            } catch (_) {
                retorno = retornoCru;
            }
            const retornoNormalizado = {
                'chat.html': '../portal/chat.html',
                './chat.html': '../portal/chat.html',
                '../portal/chat.html': '../portal/chat.html',
                'meus-projetos.html': '../cliente/meus-projetos.html',
                './meus-projetos.html': '../cliente/meus-projetos.html',
                '../cliente/meus-projetos.html': '../cliente/meus-projetos.html',
                'chamados.html': '../cliente/chamados.html',
                './chamados.html': '../cliente/chamados.html',
                '../cliente/chamados.html': '../cliente/chamados.html'
            }[retorno];

            if (retornoNormalizado) {
                params.set('return', retornoNormalizado);
            } else {
                params.delete('return');
            }
        }
        const query = params.toString();
        const destinoFinal = `${destinoBase}${query ? `?${query}` : ''}${window.location.hash || ''}`;
        document.getElementById('loginLink').href = destinoFinal;
        window.location.replace(destinoFinal);
    </script>
</body>
</html>
