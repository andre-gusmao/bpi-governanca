<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cliente | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--secondary) 0%, #003D5C 100%);
        }

        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo img {
            height: 60px;
            margin-bottom: 1rem;
        }

        .login-logo h1 {
            color: var(--secondary);
            font-size: 1.5rem;
            margin: 0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 5px rgba(201, 149, 111, 0.3);
        }

        .login-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .login-btn:hover {
            background: var(--primary-dark);
        }

        .login-links {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .login-links a {
            color: var(--primary);
            text-decoration: none;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: #E8F4F8;
            border-left: 4px solid #00A3CC;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .demo-credentials h4 {
            margin: 0 0 0.5rem 0;
            color: #00A3CC;
        }

        .demo-credentials p {
            margin: 0.25rem 0;
            color: var(--text);
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            font-weight: 600;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <img src="../assets/images/logobpi-light.svg" alt="BPI Governança">
                <h1>BPI Governança</h1>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('cliente')">Cliente</button>
                <button class="tab" onclick="switchTab('colaborador')">Colaborador</button>
            </div>

            <!-- TAB CLIENTE -->
            <div id="cliente-tab" class="tab-content active">
                <form class="login-form" onsubmit="loginCliente(event)">
                    <div class="form-group">
                        <label for="email-cliente">Email</label>
                        <input type="email" id="email-cliente" required placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="senha-cliente">Senha</label>
                        <input type="password" id="senha-cliente" required placeholder="Sua senha">
                    </div>
                    <button type="submit" class="login-btn">Entrar</button>
                </form>

                <div class="login-links">
                    <a href="#">Esqueceu a senha?</a>
                    <a href="#">Criar conta</a>
                </div>

                <div class="demo-credentials">
                    <h4>Credenciais de Teste (Cliente)</h4>
                    <p><strong>Email:</strong> cliente@empresa.com</p>
                    <p><strong>Senha:</strong> Qualquer senha</p>
                </div>
            </div>

            <!-- TAB COLABORADOR -->
            <div id="colaborador-tab" class="tab-content">
                <form class="login-form" onsubmit="loginColaborador(event)">
                    <div class="form-group">
                        <label for="email-colab">Email</label>
                        <input type="email" id="email-colab" required placeholder="seu@bpigovernanca.com.br">
                    </div>
                    <div class="form-group">
                        <label for="senha-colab">Senha</label>
                        <input type="password" id="senha-colab" required placeholder="Sua senha">
                    </div>
                    <button type="submit" class="login-btn">Entrar</button>
                </form>

                <div class="demo-credentials">
                    <h4>Credenciais de Teste (Colaborador)</h4>
                    <p><strong>PMO:</strong> pmo@bpigovernanca.com.br / PMO123!</p>
                    <p><strong>Comercial:</strong> comercial@bpigovernanca.com.br / Comercial123!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        function loginCliente(e) {
            e.preventDefault();
            const email = document.getElementById('email-cliente').value;
            const senha = document.getElementById('senha-cliente').value;
            
            const user = AuthManager.login(email, senha, 'cliente');
            if (user) {
                showNotification('Login realizado com sucesso!', 'success');
                setTimeout(() => {
                    window.location.href = './dashboard.html';
                }, 500);
            } else {
                showNotification('Email ou senha inválidos', 'error');
            }
        }

        function loginColaborador(e) {
            e.preventDefault();
            const email = document.getElementById('email-colab').value;
            const senha = document.getElementById('senha-colab').value;
            
            const user = AuthManager.login(email, senha, 'colaborador');
            if (user) {
                showNotification('Login realizado com sucesso!', 'success');
                setTimeout(() => {
                    window.location.href = '../colaborador/dashboard.html';
                }, 500);
            } else {
                showNotification('Email ou senha inválidos', 'error');
            }
        }
    </script>
</body>
</html>
