<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk Interno - Login</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/helpdesk.css">
</head>
<body data-page="login">
  <main class="login-page">
    <section class="login-card">
      <h1>Help Desk Interno</h1>
      <p>Login exclusivo para colaboradores.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="seu.email@bpi.com.br">
        <label for="senha">Senha</label>
        <input id="senha" type="password" required placeholder="••••••••">
        <p id="erroLogin" class="error"></p>
        <button class="btn" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <script src="../assets/js/helpdesk-interno.js"></script>
</body>
</html>
