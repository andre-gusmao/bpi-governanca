<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk - Configurações</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/helpdesk.css">
</head>
<body data-page="config">
  <div class="portal-container">
    <aside class="sidebar">
      <h2>BPI Help Desk</h2><small data-session-name></small>
      <nav class="nav">
        <a href="./dashboard.html">Dashboard</a>
        <a href="./fila.html">Fila</a>
        <a href="./base-conhecimento.html">Base de Conhecimento</a>
        <a href="./relatorios.html">Relatórios</a>
        <a class="active" href="./config.html">Configurações</a>
      </nav>
    </aside>
    <section class="main">
      <header class="header"><h1>Configurações Help Desk</h1><button class="btn secondary" data-logout>Sair</button></header>
      <main class="content">
        <section class="card table-wrap">
          <h3>SLA por Modalidade</h3>
          <table><thead><tr><th>Modalidade</th><th>Prazo SLA (horas)</th><th>Ações</th></tr></thead><tbody id="slaBody"></tbody></table>
        </section>

        <section class="grid-2">
          <article class="card">
            <h3>Templates de Resposta</h3>
            <form id="formTemplate">
              <input id="templateId" type="hidden">
              <label for="templateTitulo">Título</label>
              <input id="templateTitulo" required>
              <label for="templateConteudo">Conteúdo</label>
              <textarea id="templateConteudo" rows="5" required></textarea>
              <button class="btn" type="submit">Salvar template</button>
            </form>
            <div class="table-wrap" style="margin-top: 12px;">
              <table><thead><tr><th>Título</th><th>Conteúdo</th><th>Ações</th></tr></thead><tbody id="templatesBody"></tbody></table>
            </div>
          </article>

          <article class="card">
            <h3>Configuração de Filas</h3>
            <label><input id="filaPadrao" type="checkbox"> Fila padrão para todas modalidades</label><br>
            <label><input id="prioridadeAutomatica" type="checkbox"> Prioridade automática por tempo em fila</label>
            <label for="especializacoes" style="margin-top:10px;display:block;">Especializações (separadas por vírgula)</label>
            <input id="especializacoes" placeholder="Cloud, BI, Integrações">

            <h4 style="margin-top:16px;">Integrações (stub)</h4>
            <label><input id="integracaoSlack" type="checkbox"> Slack</label><br>
            <label><input id="integracaoEmail" type="checkbox"> Email</label><br>
            <label><input id="integracaoCrm" type="checkbox"> CRM</label>
            <div style="margin-top: 12px;"><button id="btnSalvarFilas" class="btn" type="button">Salvar Configuração</button></div>
          </article>
        </section>
      </main>
    </section>
  </div>
  <script src="../assets/js/helpdesk-interno.js"></script>
</body>
</html>
