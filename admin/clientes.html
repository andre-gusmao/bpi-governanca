<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Clientes | BPI</title>
    <link rel="stylesheet" href="../assets/css/admin-panel.css">
</head>
<body data-page="clientes">
    <div class="app">
        <aside class="sidebar">
            <h2>BPI Admin</h2>
            <a href="/admin/dashboard.html">Dashboard</a>
            <a class="active" href="/admin/clientes.html">Clientes</a>
            <a href="/admin/colaboradores.html">Colaboradores</a>
            <a href="/admin/catalogo.html">Catálogo</a>
            <a href="/admin/relatorios.html">Relatórios</a>
            <a href="/admin/configuracoes.html">Configurações</a>
            <a href="/admin/auditoria.html">Auditoria</a>
            <button class="btn btn-primary" data-action="logout" style="width:100%;margin-top:1rem;">Logout</button>
        </aside>
        <main class="main">
            <header class="topbar">
                <div><h1 class="title">Clientes</h1><p class="subtitle">CRUD completo de clientes</p></div>
                <div class="inline" style="max-width:420px;">
                    <button id="btn-novo-cliente" class="btn btn-primary">Novo Cliente</button>
                    <small data-admin-user class="muted"></small>
                </div>
            </header>
            <section class="card">
                <div class="filters">
                    <select id="filtro-status"><option value="todos">Todos</option><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
                    <select id="ordenacao"><option value="data">Data</option><option value="nome">Nome</option><option value="cnpj">CNPJ</option></select>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Razão Social</th><th>CNPJ</th><th>Email</th><th>Telefone</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="clientes-body"></tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="modal-cliente" class="modal">
        <div class="card modal-body">
            <h3>Cadastro de Cliente</h3>
            <form id="cliente-form">
                <div class="inline">
                    <div><label>Razão Social</label><input id="cliente-razao" required></div>
                    <div><label>CNPJ</label><input id="cliente-cnpj" required></div>
                </div>
                <div class="inline">
                    <div><label>Email</label><input id="cliente-email" type="email" required></div>
                    <div><label>Telefone</label><input id="cliente-telefone"></div>
                </div>
                <label>Endereço</label>
                <textarea id="cliente-endereco"></textarea>
                <div class="topbar" style="margin-top:.8rem;"><h4>Contatos</h4><button id="add-contato" type="button" class="btn btn-ghost">Adicionar contato</button></div>
                <div id="contatos-list" class="grid"></div>
                <div class="inline" style="margin-top:1rem;">
                    <button type="button" class="btn btn-ghost" data-close-modal="modal-cliente">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-historico-cliente" class="modal">
        <div class="card modal-body">
            <h3>Histórico de Ações do Cliente</h3>
            <ul id="historico-cliente-body"></ul>
            <button type="button" class="btn btn-ghost" data-close-modal="modal-historico-cliente">Fechar</button>
        </div>
    </div>

    <script src="../assets/js/admin-panel.js"></script>
</body>
</html>
