<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/logobpi.png" alt="BPI">
                <span style="font-weight: 700;">BPI</span>
            </div>

            <ul class="sidebar-menu">
                <li><a href="dashboard-admin.html">📊 Dashboard</a></li>
                <li><a href="chamados-admin.html">🎫 Chamados</a></li>
                <li><a href="clientes.html" class="active">👥 Clientes</a></li>
                <li><a href="usuarios.html">👤 Usuários/Atendentes</a></li>
                <li><a href="sla-config.html">⚙️ Configurações</a></li>
            </ul>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.2);">
                <button onclick="logoutAdmin()" class="btn btn-primary" style="width: 100%; background-color: rgba(201, 166, 107, 0.8);">
                    Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <div>
                    <h1>Gerenciar Clientes</h1>
                    <p style="color: #555555; margin: 0;">Cadastro e controle de clientes</p>
                </div>
                <button onclick="abrirFormNovoCliente()" class="btn btn-primary">+ Novo Cliente</button>
            </div>

            <!-- Tabela de Clientes -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome/Empresa</th>
                            <th>Email</th>
                            <th>Telefone</th>
                            <th>Chamados</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes">
                        <!-- Preenchido dinamicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Novo Cliente -->
    <div id="modalNovoCliente" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div class="dashboard-card" style="max-width: 500px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0;">Novo Cliente</h2>
                <button onclick="fecharFormNovoCliente()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">✕</button>
            </div>

            <form id="formNovoCliente" onsubmit="salvarCliente(event)">
                <div class="form-group">
                    <label>Nome/Empresa</label>
                    <input type="text" id="nomeCliente" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailCliente" required>
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefoneCliente">
                </div>

                <div class="form-group">
                    <label>Endereço</label>
                    <input type="text" id="enderecoCliente">
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" onclick="fecharFormNovoCliente()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/helpdesk.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script>
        // Sistema de gerenciamento de clientes
        const ClientesDB = {
            obterTodos: function() {
                return BPIAdminCore.data.clientes();
            },
            
            salvar: function(cliente) {
                BPIAdminCore.data.salvarCliente(cliente);
            },

            alternarStatus: function(id) {
                BPIAdminCore.data.atualizarStatusCliente(id);
            }
        };

        function verificarAutenticacao() {
            BPIAdminCore.auth.requireSession({ allowTypes: ['admin'] });
        }

        function logoutAdmin() {
            BPIAdminCore.auth.logout();
        }

        function carregarClientes() {
            const clientes = ClientesDB.obterTodos();
            const tbody = document.getElementById('tbodyClientes');
            tbody.innerHTML = '';

            clientes.forEach(cliente => {
                const chamadosCliente = ChamadosDB.obterPorCliente(cliente.id);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cliente.id}</td>
                    <td><strong>${cliente.nome}</strong></td>
                    <td>${cliente.email}</td>
                    <td>${cliente.telefone || '-'}</td>
                    <td><span style="background: #f0f0f0; padding: 0.4rem 0.8rem; border-radius: 20px;">${chamadosCliente.length}</span></td>
                    <td><span style="color: ${cliente.ativo ? '#28A745' : '#DC143C'}; font-weight: 600;">${cliente.ativo ? '✓ Ativo' : '✗ Inativo'}</span></td>
                    <td>
                        <button type="button" onclick="editarCliente('${cliente.id}')" style="color: #8A6A35; margin-right: 0.5rem; background: #fff9ef; border: 1px solid #C9A66B; border-radius: 6px; cursor: pointer; padding: 0.3rem 0.55rem; font-weight: 600;">✏️ Editar</button>
                        <button type="button" onclick="alternarStatusCliente('${cliente.id}')" style="color: #7f1d1d; background: #fef2f2; border: 1px solid #ef4444; border-radius: 6px; cursor: pointer; padding: 0.3rem 0.55rem; font-weight: 600;">${cliente.ativo ? '⏸ Inativar' : '▶ Reativar'}</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function abrirFormNovoCliente() {
            document.getElementById('modalNovoCliente').style.display = 'flex';
        }

        function fecharFormNovoCliente() {
            document.getElementById('modalNovoCliente').style.display = 'none';
            document.getElementById('formNovoCliente').reset();
        }

        function salvarCliente(e) {
            e.preventDefault();
            
            const cliente = {
                nome: document.getElementById('nomeCliente').value,
                email: document.getElementById('emailCliente').value,
                telefone: document.getElementById('telefoneCliente').value,
                endereco: document.getElementById('enderecoCliente').value
            };

            ClientesDB.salvar(cliente);
            alert('✅ Cliente cadastrado com sucesso!');
            fecharFormNovoCliente();
            carregarClientes();
        }

        function editarCliente(id) {
            alert('Edição detalhada será disponibilizada na próxima etapa.');
        }

        function alternarStatusCliente(id) {
            if (confirm('Deseja alterar o status deste cliente?')) {
                ClientesDB.alternarStatus(id);
                carregarClientes();
            }
        }

        window.addEventListener('load', () => {
            verificarAutenticacao();
            BPIAdminCore.renderAdminMenu('clientes');
            carregarClientes();
        });
    </script>
</body>
</html>
