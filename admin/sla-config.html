<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações de SLA | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/logobpi.png" alt="BPI">
                <span style="font-weight: 700;">BPI</span>
            </div>

            <ul class="sidebar-menu">
                <li><a href="dashboard-admin.html">📊 Dashboard</a></li>
                <li><a href="chamados-admin.html">🎫 Chamados</a></li>
                <li><a href="clientes.html">👥 Clientes</a></li>
                <li><a href="usuarios.html">👤 Usuários/Atendentes</a></li>
                <li><a href="sla-config.html" class="active">⚙️ Configurações</a></li>
            </ul>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.2);">
                <button onclick="logoutAdmin()" class="btn btn-primary" style="width: 100%; background-color: rgba(201, 166, 107, 0.8);">
                    Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <div>
                    <h1>⚙️ Configurações de SLA</h1>
                    <p style="color: #555555; margin: 0;">Tempo de resposta e prioridades</p>
                </div>
            </div>

            <!-- Tabela de SLA por Modalidade -->
            <div class="table-wrapper" style="margin-bottom: 2rem;">
                <h3>📋 SLA por Modalidade</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Modalidade</th>
                            <th>Crítica (h)</th>
                            <th>Alta (h)</th>
                            <th>Média (h)</th>
                            <th>Baixa (h)</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaSLA">
                        <!-- Preenchido dinamicamente -->
                    </tbody>
                </table>
            </div>

            <!-- Prioridades -->
            <div class="table-wrapper">
                <h3>🎯 Prioridades</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Prioridade</th>
                            <th>Nível</th>
                            <th>Tempo Resposta (h)</th>
                            <th>Cor</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaPrioridades">
                        <!-- Preenchido dinamicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../assets/js/helpdesk.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script>
        function verificarAutenticacao() {
            BPIAdminCore.auth.requireSession({ allowTypes: ['admin'] });
        }

        function logoutAdmin() {
            BPIAdminCore.auth.logout();
        }

        function carregarSLA() {
            const tbody = document.getElementById('tabelaSLA');
            tbody.innerHTML = '';

            Object.entries(HelpDeskConfig.modalidades).forEach(([key, modalidade]) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${modalidade.nome}</strong></td>
                    <td>${modalidade.sla.critico}</td>
                    <td>${modalidade.sla.alto}</td>
                    <td>${modalidade.sla.medio}</td>
                    <td>${modalidade.sla.baixo}</td>
                    <td><a href="#" onclick="editarSLA('${key}')" style="color: #C9A66B;">Editar</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function carregarPrioridades() {
            const tbody = document.getElementById('tabelaPrioridades');
            tbody.innerHTML = '';

            Object.entries(HelpDeskConfig.prioridades).forEach(([key, prioridade]) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${prioridade.label}</strong></td>
                    <td>${prioridade.nivel}</td>
                    <td>${prioridade.horasResposta}</td>
                    <td><span style="display: inline-block; width: 20px; height: 20px; background: ${prioridade.cor}; border-radius: 3px;"></span></td>
                    <td><a href="#" onclick="editarPrioridade('${key}')" style="color: #C9A66B;">Editar</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function editarSLA(key) {
            alert('Editor de SLA em desenvolvimento');
        }

        function editarPrioridade(key) {
            alert('Editor de prioridade em desenvolvimento');
        }

        window.addEventListener('load', () => {
            BPIAdminCore.renderAdminMenu('configuracoes');
            verificarAutenticacao();
            carregarSLA();
            carregarPrioridades();
        });
    </script>
</body>
</html>
