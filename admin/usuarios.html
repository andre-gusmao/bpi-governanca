<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários e Atendentes | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="../assets/images/logobpi.png" alt="BPI">
                <span style="font-weight: 700;">BPI</span>
            </div>

            <ul class="sidebar-menu">
                <li><a href="dashboard-admin.html">📊 Dashboard</a></li>
                <li><a href="chamados-admin.html">🎫 Chamados</a></li>
                <li><a href="clientes.html">👥 Clientes</a></li>
                <li><a href="usuarios.html" class="active">👤 Usuários/Atendentes</a></li>
                <li><a href="sla-config.html">⚙️ Configurações</a></li>
            </ul>

            <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.2);">
                <button onclick="logoutAdmin()" class="btn btn-primary" style="width: 100%; background-color: rgba(201, 166, 107, 0.8);">
                    Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <div>
                    <h1>Usuários e Atendentes</h1>
                    <p style="color: #555555; margin: 0;">Gerenciamento de equipe</p>
                </div>
                <button onclick="abrirFormNovoUsuario()" class="btn btn-primary">+ Novo Usuário</button>
            </div>

            <!-- Tabela de Usuários -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Tipo</th>
                            <th>Chamados Atribuídos</th>
                            <th>Performance</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyUsuarios">
                        <!-- Preenchido dinamicamente -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Novo Usuário -->
    <div id="modalNovoUsuario" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; align-items: center; justify-content: center;">
        <div class="dashboard-card" style="max-width: 500px; width: 90%;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2 style="margin: 0;">Novo Usuário</h2>
                <button onclick="fecharFormNovoUsuario()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">✕</button>
            </div>

            <form id="formNovoUsuario" onsubmit="salvarUsuario(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nomeUsuario" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emailUsuario" required>
                </div>

                <div class="form-group">
                    <label>Tipo</label>
                    <select id="tipoUsuario" required>
                        <option value="">Selecione...</option>
                        <option value="admin">Administrador</option>
                        <option value="atendente">Atendente</option>
                        <option value="supervisor">Supervisor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senhaUsuario" required>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                    <button type="button" onclick="fecharFormNovoUsuario()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar Usuário</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/helpdesk.js"></script>
    <script>
        // Sistema de gerenciamento de usuários
        const UsuariosDB = {
            obterTodos: function() {
                const usuarios = localStorage.getItem('helpdesk_usuarios');
                return usuarios ? JSON.parse(usuarios) : [
                    { id: 'USR-001', nome: 'João Silva', email: 'joao@bpi.com.br', tipo: 'atendente', ativo: true, chamadosAtribuidos: 8 },
                    { id: 'USR-002', nome: 'Maria Santos', email: 'maria@bpi.com.br', tipo: 'atendente', ativo: true, chamadosAtribuidos: 12 },
                    { id: 'USR-003', nome: 'Admin BPI', email: 'admin@bpi.com.br', tipo: 'admin', ativo: true, chamadosAtribuidos: 0 }
                ];
            },
            
            salvar: function(usuario) {
                const usuarios = this.obterTodos();
                usuario.id = 'USR-' + Date.now();
                usuario.dataCriacao = new Date().toISOString();
                usuario.ativo = true;
                usuario.chamadosAtribuidos = 0;
                usuarios.push(usuario);
                localStorage.setItem('helpdesk_usuarios', JSON.stringify(usuarios));
                return usuario;
            }
        };

        function verificarAutenticacao() {
            const session = localStorage.getItem('adminSession');
            if (!session) {
                window.location.href = 'login-admin.html';
            }
        }

        function logoutAdmin() {
            if (confirm('Deseja realmente sair?')) {
                localStorage.removeItem('adminSession');
                window.location.href = 'login-admin.html';
            }
        }

        function carregarUsuarios() {
            const usuarios = UsuariosDB.obterTodos();
            const tbody = document.getElementById('tbodyUsuarios');
            tbody.innerHTML = '';

            usuarios.forEach(usuario => {
                const tr = document.createElement('tr');
                const performance = usuario.chamadosAtribuidos > 0 ? (Math.random() * 30 + 70).toFixed(0) + '%' : '-';
                tr.innerHTML = `
                    <td><strong>${usuario.nome}</strong></td>
                    <td>${usuario.email}</td>
                    <td><span style="background: #f0f0f0; padding: 0.4rem 0.8rem; border-radius: 5px; font-size: 0.85rem;">${usuario.tipo}</span></td>
                    <td>${usuario.chamadosAtribuidos}</td>
                    <td><span style="color: ${performance !== '-' && parseInt(performance) >= 80 ? '#28A745' : '#FFA500'};">${performance}</span></td>
                    <td><span style="color: #28A745; font-weight: 600;">${usuario.ativo ? '✓ Ativo' : '✗ Inativo'}</span></td>
                    <td>
                        <a href="#" onclick="editarUsuario('${usuario.id}')" style="color: #C9A66B; margin-right: 1rem;">Editar</a>
                        <a href="#" onclick="excluirUsuario('${usuario.id}')" style="color: #DC143C;">Excluir</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function abrirFormNovoUsuario() {
            document.getElementById('modalNovoUsuario').style.display = 'flex';
        }

        function fecharFormNovoUsuario() {
            document.getElementById('modalNovoUsuario').style.display = 'none';
            document.getElementById('formNovoUsuario').reset();
        }

        function salvarUsuario(e) {
            e.preventDefault();
            
            const usuario = {
                nome: document.getElementById('nomeUsuario').value,
                email: document.getElementById('emailUsuario').value,
                tipo: document.getElementById('tipoUsuario').value,
                senha: document.getElementById('senhaUsuario').value
            };

            UsuariosDB.salvar(usuario);
            alert('✅ Usuário criado com sucesso!');
            fecharFormNovoUsuario();
            carregarUsuarios();
        }

        function editarUsuario(id) {
            alert('Função de editar em desenvolvimento');
        }

        function excluirUsuario(id) {
            if (confirm('Deseja realmente excluir este usuário?')) {
                alert('Usuário excluído com sucesso');
                carregarUsuarios();
            }
        }

        window.addEventListener('load', () => {
            verificarAutenticacao();
            carregarUsuarios();
        });
    </script>
</body>
</html>
