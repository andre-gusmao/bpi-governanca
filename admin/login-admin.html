<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Administrativo | BPI Governança</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0F1117 0%, #171C25 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, #0F1117 0%, #C9A66B 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .login-header h1 {
            color: #0F1117;
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }

        .login-header p {
            color: #666;
            margin: 0;
            font-size: 0.9rem;
        }

        .login-type {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .login-type-btn {
            padding: 1rem;
            border: 2px solid #e8e8e8;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .login-type-btn:hover {
            border-color: #C9A66B;
        }

        .login-type-btn.active {
            background: #C9A66B;
            color: white;
            border-color: #C9A66B;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #0F1117;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #C9A66B;
            box-shadow: 0 0 0 3px rgba(201, 166, 107, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #C9A66B 0%, #A0844A 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(201, 166, 107, 0.3);
        }

        .demo-credentials {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid #C9A66B;
        }

        .demo-credentials h4 {
            margin: 0 0 0.75rem 0;
            color: #0F1117;
            font-size: 0.95rem;
        }

        .demo-credentials p {
            margin: 0.35rem 0;
            color: #666;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">BPI</div>
            <h1>Painel Administrativo</h1>
            <p>BPI Governança - Help Desk</p>
        </div>

        <div class="demo-credentials">
            <h4>🔐 Credenciais de Demonstração:</h4>
            <p><strong>Admin:</strong> admin@bpi.com.br / admin123</p>
            <p><strong>Atendente:</strong> atendente@bpi.com.br / 12345</p>
        </div>

        <div class="login-type">
            <button class="login-type-btn active" onclick="setLoginType(event, 'admin')" type="button">
                👨‍💼 Administrador
            </button>
            <button class="login-type-btn" onclick="setLoginType(event, 'atendente')" type="button">
                👨‍💻 Atendente
            </button>
        </div>

        <form onsubmit="fazerLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>

        <div class="login-footer" style="text-align: center; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #e8e8e8;">
            <p style="color: #666; margin: 0;">Voltar para <a href="../index.html" style="color: #C9A66B; text-decoration: none; font-weight: 600;">página inicial</a></p>
        </div>
    </div>

    <script src="../assets/js/helpdesk.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script>
        let tipoLoginAtual = 'admin';

        function setLoginType(event, tipo) {
            tipoLoginAtual = tipo;
            document.querySelectorAll('.login-type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        function fazerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const usuarios = BPIAdminCore.data.usuarios();
            const usuarioValido = usuarios.find((usuario) => usuario.email === email && usuario.senha === senha && usuario.tipo === tipoLoginAtual && usuario.ativo);

            if (usuarioValido) {
                const userData = {
                    type: tipoLoginAtual,
                    email: email,
                    name: usuarioValido.nome || (tipoLoginAtual === 'admin' ? 'Administrador BPI' : 'Atendente BPI'),
                    loginTime: new Date().toISOString(),
                    id: usuarioValido.id
                };

                BPIAdminCore.auth.login(userData);
                alert('✅ Login realizado com sucesso!');
                
                if (tipoLoginAtual === 'admin') {
                    window.location.href = 'dashboard-admin.html';
                } else {
                    window.location.href = 'dashboard-atendente.html';
                }
            } else {
                alert('Credenciais inválidas para o perfil selecionado.');
            }
        }

        window.addEventListener('load', () => {
            const session = BPIAdminCore.auth.getSession();
            if (session) {
                if (!BPIAdminCore.auth.isTrustedSession(session)) {
                    localStorage.removeItem(BPIAdminCore.KEYS.session);
                    return;
                }
                if (session.type === 'admin') {
                    window.location.href = 'dashboard-admin.html';
                } else {
                    window.location.href = 'dashboard-atendente.html';
                }
            }
        });
    </script>
</body>
</html>
