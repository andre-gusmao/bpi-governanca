<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Colaboradores | BPI</title>
    <link rel="stylesheet" href="../assets/css/admin-panel.css">
</head>
<body data-page="colaboradores">
    <div class="app">
        <aside class="sidebar">
            <h2>BPI Admin</h2>
            <a href="/admin/dashboard.html">Dashboard</a>
            <a href="/admin/clientes.html">Clientes</a>
            <a class="active" href="/admin/colaboradores.html">Colaboradores</a>
            <a href="/admin/catalogo.html">Catálogo</a>
            <a href="/admin/relatorios.html">Relatórios</a>
            <a href="/admin/configuracoes.html">Configurações</a>
            <a href="/admin/auditoria.html">Auditoria</a>
            <button class="btn btn-primary" data-action="logout" style="width:100%;margin-top:1rem;">Logout</button>
        </aside>
        <main class="main">
            <header class="topbar">
                <div><h1 class="title">Colaboradores</h1><p class="subtitle">Gestão de equipe</p></div>
                <div class="inline" style="max-width:460px;">
                    <button id="btn-novo-colaborador" class="btn btn-primary">Novo Colaborador</button>
                    <small data-admin-user class="muted"></small>
                </div>
            </header>
            <section class="card">
                <div class="filters">
                    <select id="filtro-status-col"><option value="todos">Todos</option><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select>
                    <select id="filtro-role-col"><option value="todos">Todos os roles</option><option>PMO_Comercial</option><option>PMO_Geral</option><option>Consultor</option><option>Suporte</option></select>
                    <select id="ordenacao-col"><option value="data">Data</option><option value="nome">Nome</option><option value="email">Email</option></select>
                </div>
                <table>
                    <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Role</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="colaboradores-body"></tbody>
                </table>
            </section>
        </main>
    </div>

    <div id="modal-colaborador" class="modal">
        <div class="card modal-body">
            <h3>Cadastro de Colaborador</h3>
            <form id="colaborador-form">
                <div class="inline">
                    <div><label>Nome</label><input id="col-nome" required></div>
                    <div><label>Email</label><input id="col-email" type="email" required></div>
                </div>
                <div class="inline">
                    <div><label>Role</label><select id="col-role" required><option>PMO_Comercial</option><option>PMO_Geral</option><option>Consultor</option><option>Suporte</option></select></div>
                    <div style="display:flex;align-items:flex-end;"><label><input type="checkbox" id="col-status" checked> Ativo</label></div>
                </div>
                <div class="inline" style="margin-top:1rem;">
                    <button type="button" class="btn btn-ghost" data-close-modal="modal-colaborador">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/admin-panel.js"></script>
</body>
</html>
